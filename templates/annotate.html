<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标注 · {{ name }}</title>
<link rel="stylesheet" href="/canvas/style.css">
</head>
<body class="page-annotate" data-name="{{ name }}" data-idx="{{ idx }}" data-total="{{ total }}">
<div class="app-shell annotate-shell">
  {% include '_sidebar.html' %}
  <main class="workbench">
    <header class="toolbar">
      <div class="tb-left"><a href="/annotate" class="btn-ghost" title="返回图片列表">← 返回</a><span class="tb-title">{{ name }}</span><span class="tb-pos">{{ idx + 1 }} / {{ total }}</span></div>
      <div class="tabs" id="modeTabs"><button data-mode="box" class="tab active" title="快捷键 1">检测框</button><button data-mode="mask" class="tab" title="快捷键 2">实例掩码</button><button data-mode="semantic" class="tab" title="快捷键 3">语义</button></div>
      <div class="tools" id="boxTools"><button data-boxtool="move" class="tool active" title="移动 V">移动</button><button data-boxtool="create" class="tool" title="新建框 N">新建框</button></div>
      <div class="tools" id="maskTools"><button data-tool="brush" class="tool active" title="画笔 W">画笔</button><button data-tool="eraser" class="tool" title="橡皮擦 E">橡皮</button><button data-tool="polygon" class="tool" title="多边形 P">多边形</button><button data-tool="move" class="tool" title="移动 V">移动</button><label class="lbl" title="快捷键 [ / ]">笔刷 <input type="range" id="brushSize" min="2" max="60" value="10"><span id="brushVal" class="bval">10</span>px</label></div>
      <button id="btnHand" class="tool hand" title="抓手 H">抓手</button>
      <select id="classSel" title="类别（顺序即编号，不得改）"></select><span id="selInfo" class="sel-info">新建类别</span>
      <div class="tb-actions"><button id="btnFit" class="btn-ghost" title="适应窗口">适应</button><button id="btnCompare" class="btn-ghost" title="左原图 / 右标注叠加">双栏</button><button id="btnUndo" class="btn-ghost" title="撤销 Ctrl+Z">↶ 撤销</button><button id="btnRedo" class="btn-ghost" title="重做 Ctrl+Shift+Z">↷ 重做</button><button id="btnSave" class="btn-primary">保存</button><button id="btnSaveNext" class="btn-primary">保存并下一张 (S)</button></div>
    </header>
    <div class="workbench-body">
      <section class="canvas-area" id="canvasArea">
        <div class="canvas-box" id="boxLeft"><canvas id="cvCompare"></canvas><div class="box-label">原图</div></div>
        <div class="canvas-box" id="boxMain"><canvas id="cvMain"></canvas><div class="box-label" id="overlayLabel">标注叠加</div><div class="legend" id="legend" hidden></div></div>
        <div class="color-legend"><h5>颜色图例</h5>{% for c in classes %}<div><i class="swatch c{{ loop.index0 }}"></i>{{ c }}</div>{% endfor %}</div>
      </section>
      <aside class="inspector">
        <h5>选中实例</h5><div class="inspect-box"><div><span>类别</span><b id="insClass">未选择</b></div><div><span>ID</span><b id="insId">—</b></div><div><span>置信度</span><b id="insConf">—</b></div><div><span>掩码点数</span><b id="insPoints">—</b></div></div>
        <h5>修正计数</h5><div class="counter-copy">本图已修改 <b id="cntMod">0</b> 处<br>累计 <b id="cntTotal">…</b> / <b id="cntTarget">60</b> 条</div>
        <h5>快捷键</h5><div class="shortcut-box"><div><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切模式</div><div><kbd>W</kbd> 画笔　<kbd>E</kbd> 橡皮</div><div><kbd>P</kbd> 多边形　<kbd>V</kbd> 移动</div><div><kbd>N</kbd> 新建框　<kbd>H</kbd> 抓手</div><div><kbd>Del</kbd> 删除　<kbd>S</kbd> 保存</div><div><kbd>Ctrl+Z</kbd> 撤销</div></div>
      </aside>
    </div>
    <footer class="navbar"><button id="btnPrev" class="btn-ghost">← 上一张</button><button id="btnNext" class="btn-ghost">下一张 →</button><button id="btnSaveNext2" class="btn-primary">保存并下一张</button><span class="nav-hint" id="hintBar">空格+拖 / 中键平移 · 滚轮缩放 · 所有修改仅在保存后落盘</span></footer>
  </main>
</div>
<script>window.APP_CONF={name:{{ name|tojson }},idx:{{ idx }},total:{{ total }},classes:{{ classes|tojson }},round:{{ round }},target:{{ target }}};</script>
<script src="/canvas/app.js"></script>
</body>
</html>
